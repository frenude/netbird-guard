[package]
name = "netbird-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/frenude/netbird-guard"
description = "Cross-platform (macOS, Linux & Windows) NetBird session watchdog with browser auto-login and Feishu bot notifications"

[[bin]]
name = "nbg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
